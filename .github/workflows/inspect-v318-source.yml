name: Inspect Onsamiro v3.1.17 Effective Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v318-source.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Extract and apply
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "수정소스_v3.1.15_빌드전.zip" -d extracted
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          fi
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/.build_overlay/v3.1.17/apply_v317.py" "$PROJECT_DIR"
      - name: Print relevant effective source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for f in             app/src/main/java/com/onsamiro/transcriber/MainActivity.java             app/src/main/java/com/onsamiro/transcriber/HistoryActivity.java             app/src/main/java/com/onsamiro/transcriber/Status.java             app/src/main/java/com/onsamiro/transcriber/JobStore.java             app/src/main/java/com/onsamiro/transcriber/WorkCoordinator.java             app/src/main/java/com/onsamiro/transcriber/WhisperBridge.java             app/src/main/cpp/whisper_jni.cpp; do
              echo "===== FILE: $f ====="
              cat "$f"
          done
