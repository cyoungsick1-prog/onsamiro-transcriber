name: Build Onsamiro APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'onsamiro_source_v301*.zip'
      - '.github/workflows/build-onsamiro.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack source ZIP
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'onsamiro_source_v301*.zip' -print | head -n1)"

          test -n "$SOURCE_ZIP"
          test -f "$SOURCE_ZIP"

          echo "Using source ZIP: $SOURCE_ZIP"

          rm -rf buildsrc
          mkdir buildsrc

          unzip -q "$SOURCE_ZIP" -d buildsrc

          PROJECT="$(find buildsrc -mindepth 1 -maxdepth 3 -type f -name settings.gradle -printf '%h\n' | head -n1)"

          test -n "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          chmod +x "$PROJECT"/scripts/*.sh || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK 35, Build Tools, NDK 28, CMake
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch pinned whisper.cpp
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT"
          ./scripts/fetch_whisper.sh

      - name: Static audit and self-test
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT"

          ./scripts/static_audit.sh

          mkdir -p build/qgtest

          javac -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java

          java -cp build/qgtest QualityGuardSelfTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT"

          gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and 16 KiB alignment
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT"

          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="${ANDROID_HOME}/build-tools/35.0.0"

          test -f "$APK"

          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK"

          TMP="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP"

          python3 - "$TMP" <<'PY'
          import sys
          import subprocess
          from pathlib import Path

          root = Path(sys.argv[1])
          libs = list(root.glob("lib/*/*.so"))

          if not libs:
              raise SystemExit("FAIL: No native libraries found")

          checked = 0

          for so in libs:
              print(f"checking {so}")

              out = subprocess.check_output(
                  ["readelf", "-lW", str(so)],
                  text=True
              )

              for line in out.splitlines():
                  parts = line.split()

                  if parts and parts[0] == "LOAD":
                      align_hex = parts[-1]
                      align = int(align_hex, 16)

                      print(f"  LOAD alignment: {align_hex} ({align} bytes)")

                      if align < 16384:
                          raise SystemExit(
                              f"FAIL: {so} PT_LOAD alignment "
                              f"{align_hex} < 0x4000"
                          )

                      checked += 1

          if checked == 0:
              raise SystemExit("FAIL: No PT_LOAD segments were checked")

          print(
              f"ELF 16KiB ALIGNMENT PASS "
              f"({len(libs)} native libraries, {checked} LOAD segments)"
          )
          PY

          sha256sum "$APK" | tee app-debug.sha256

      - name: Stage artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p out

          cp \
            "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" \
            "out/온새미로_자동전사_v3.0.1_신규설치.apk"

          cp \
            "$PROJECT/app-debug.sha256" \
            "out/SHA256.txt"

          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-v3.0.1-clean-install
          path: out/*
          if-no-files-found: error
          retention-days: 7
