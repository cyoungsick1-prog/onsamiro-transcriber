name: Build Onsamiro Android APK - Background Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'onsamiro_source_v3112_background_recovery_FINAL.zip'
      - '.github/workflows/android-build-background-recovery.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/onsamiro_source_v3112_background_recovery_FINAL.zip"

          test -f "$ZIP" || {
            echo "ERROR: source ZIP not found: $ZIP"
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name settings.gradle \
            -printf '%h\n' \
            | head -n 1)"

          test -n "$PROJECT_DIR" || {
            echo "ERROR: settings.gradle not found"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            | sort -V \
            | tail -n 1)"

          test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch whisper.cpp
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          bash ./scripts/fetch_whisper.sh

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          bash ./scripts/static_audit.sh
          python3 ./tools/NoThermalStopSelfTest.py
          python3 ./tools/ThermalRecoverySelfTest.py

          rm -rf build/qgtest
          mkdir -p build/qgtest

          javac \
            -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java

          java -cp build/qgtest QualityGuardSelfTest

      - name: Verify background recovery changes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -R "START_STICKY" \
            app/src/main/java/com/onsamiro/transcriber

          grep -R "startForeground" \
            app/src/main/java/com/onsamiro/transcriber

          grep -R "FOREGROUND_SERVICE" \
            app/src/main/AndroidManifest.xml

          grep -R "BOOT_COMPLETED" \
            app/src/main/AndroidManifest.xml

          grep -R "onTaskRemoved" \
            app/src/main/java/com/onsamiro/transcriber

          echo "BACKGROUND_RECOVERY_SOURCE_CHECK PASS"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: APK not created"
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/dist/onsamiro_auto_transcriber_v3.1.12_background_recovery.apk"

          cd "$GITHUB_WORKSPACE/dist"

          sha256sum \
            onsamiro_auto_transcriber_v3.1.12_background_recovery.apk \
            > onsamiro_auto_transcriber_v3.1.12_background_recovery.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-auto-transcriber-v3.1.12-background-recovery
          path: |
            dist/onsamiro_auto_transcriber_v3.1.12_background_recovery.apk
            dist/onsamiro_auto_transcriber_v3.1.12_background_recovery.sha256
          if-no-files-found: error
          retention-days: 30
