name: Voice Recovery Test

on:
  push:
    paths:
      - ".github/workflows/voice-recovery.yml"
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TTS
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Generate Korean voice
        run: |
          edge-tts             --voice "ko-KR-InJoonNeural"             --rate="+10%"             --text "세상안 음성 회수 테스트입니다."             --write-media voice.mp3
          python - <<'PY'
          from pathlib import Path
          p = Path("voice.mp3")
          assert p.exists() and p.stat().st_size > 1000
          print("VOICE_BYTES", p.stat().st_size)
          PY

      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-recovery-test
          path: voice.mp3
          if-no-files-found: error
          retention-days: 1
