name: Runway Audio Recovery

on:
  push:
    paths:
      - ".voice-recovery/request.txt"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover audio from signed URL
        shell: bash
        run: |
          set -euo pipefail
          URL="$(head -n 1 .voice-recovery/request.txt | tr -d '\r\n')"
          if [[ "$URL" != https://* ]]; then
            echo "Invalid URL"
            exit 2
          fi
          curl -L --fail --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 180 "$URL" -o recovered.mp3
          test -s recovered.mp3
          BYTES="$(wc -c < recovered.mp3 | tr -d ' ')"
          if [ "$BYTES" -lt 1000 ]; then
            echo "Recovered audio is unexpectedly small: $BYTES"
            exit 3
          fi
          echo "bytes=$BYTES"
          sha256sum recovered.mp3 | tee recovered.sha256
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration,format_name -of default=nw=1 recovered.mp3 | tee recovered.ffprobe.txt
          else
            echo "ffprobe unavailable" | tee recovered.ffprobe.txt
          fi

      - name: Upload recovered audio
        uses: actions/upload-artifact@v4
        with:
          name: runway-audio-recovered
          path: |
            recovered.mp3
            recovered.sha256
            recovered.ffprobe.txt
          if-no-files-found: error
          retention-days: 1
