name: Build Onsamiro v3.1.15 Auto Start Recovery

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '수정소스_v3.1.15_빌드전.zip'
      - '.github/workflows/GitHub_Action_빌드_v3.1.15.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/수정소스_v3.1.15_빌드전.zip"

          test -f "$ZIP" || {
            echo "ERROR: source ZIP not found: $ZIP"
            echo "Repository root files:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction complete"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name settings.gradle \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name settings.gradle.kts \
              -printf '%h\n' \
              | head -n 1)"
          fi

          test -n "$PROJECT_DIR" || {
            echo "ERROR: Android project not found"
            echo "Extracted folders:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f | head -200
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            | sort -V \
            | tail -n 1)"

          test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch whisper.cpp
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x scripts/*.sh || true

          test -f "./scripts/fetch_whisper.sh" || {
            echo "ERROR: scripts/fetch_whisper.sh not found"
            exit 1
          }

          bash ./scripts/fetch_whisper.sh

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f "./scripts/static_audit.sh" || {
            echo "ERROR: scripts/static_audit.sh not found"
            exit 1
          }

          chmod +x scripts/*.sh || true

          bash ./scripts/static_audit.sh

          python3 ./tools/NoThermalStopSelfTest.py
          python3 ./tools/ThermalRecoverySelfTest.py
          python3 ./tools/BackgroundRecoverySelfTest.py
          python3 ./tools/FullFolderScanSelfTest.py

          grep -q "applicationId 'com.onsamiro.transcriber.v3110'" \
            app/build.gradle

          grep -q "versionName '3.1.15-auto-start-recovery'" \
            app/build.gradle

          grep -q 'AUTO_SAF_FALLBACK_MAX_DOCS = Integer.MAX_VALUE' \
            app/src/main/java/com/onsamiro/transcriber/DocumentScanner.java

          grep -q '녹음폴더 전체확인' \
            app/src/main/java/com/onsamiro/transcriber/DocumentScanner.java

          grep -q 'if (!r.truncated) cfg.setLastRecoveryScanMs(started);' \
            app/src/main/java/com/onsamiro/transcriber/DocumentScanner.java

          grep -q 'prepareFullFolderScanFixMigration' \
            app/src/main/java/com/onsamiro/transcriber/AppConfig.java

          grep -q 'WATCHDOG_MS = 45_000L' \
            app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java

          grep -q 'runDirectRecovery(false)' \
            app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java

          grep -q 'ACTIVE_WAKELOCK_MS' \
            app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java

          grep -q 'PROCESS_RUNNING' \
            app/src/main/java/com/onsamiro/transcriber/WorkCoordinator.java

          grep -q 'android:name=".TranscriptionKeepAliveService"' \
            app/src/main/AndroidManifest.xml

          grep -q 'android:foregroundServiceType="specialUse"' \
            app/src/main/AndroidManifest.xml

          ! grep -q 'POST_NOTIFICATIONS' \
            app/src/main/AndroidManifest.xml

          rm -rf build/qgtest
          mkdir -p build/qgtest

          javac \
            -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java

          java -cp build/qgtest QualityGuardSelfTest

          echo "Regression checks passed"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: APK not created"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          }

          test -f "./scripts/verify_apk.sh" || {
            echo "ERROR: scripts/verify_apk.sh not found"
            exit 1
          }

          bash ./scripts/verify_apk.sh "$APK"

          echo "APK verification complete"
          ls -lh "$APK"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/dist/온새미로_자동전사_v3.1.15_자동시작복구.apk"

          cp \
            "$GITHUB_WORKSPACE/수정소스_v3.1.15_빌드전.zip" \
            "$GITHUB_WORKSPACE/dist/onsamiro_source_v3115_auto_start_recovery_FINAL.zip"

          cd "$GITHUB_WORKSPACE/dist"

          sha256sum \
            "온새미로_자동전사_v3.1.15_자동시작복구.apk" \
            "onsamiro_source_v3115_auto_start_recovery_FINAL.zip" \
            > SHA256.txt

          echo "Build artifacts:"
          ls -lh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-v3.1.15-auto-start-recovery
          path: |
            dist/온새미로_자동전사_v3.1.15_자동시작복구.apk
            dist/onsamiro_source_v3115_auto_start_recovery_FINAL.zip
            dist/SHA256.txt
          if-no-files-found: warn
          retention-days: 30
