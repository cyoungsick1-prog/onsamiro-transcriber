name: Build Onsamiro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/onsamiro_source_v3111_no_thermal_stop_CLEAN.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: source ZIP not found: $ZIP"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f | sort | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash ./scripts/fetch_whisper.sh

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          bash ./scripts/static_audit.sh
          python3 ./tools/NoThermalStopSelfTest.py
          python3 ./tools/ThermalRecoverySelfTest.py

          rm -rf build/qgtest
          mkdir -p build/qgtest
          javac \
            -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java
          java -cp build/qgtest QualityGuardSelfTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not created"
            exit 1
          fi

          bash ./scripts/verify_apk.sh "$APK"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk"

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk \
            > onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.sha256
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-auto-transcriber-v3.1.11-no-thermal-stop
          path: |
            dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk
            dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.sha256
          if-no-files-found: error
          retention-days: 30
