name: Build Onsamiro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name settings.gradle -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch whisper.cpp
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          bash ./scripts/fetch_whisper.sh

      - name: Run static audit
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          bash ./scripts/static_audit.sh
          python3 ./tools/NoThermalStopSelfTest.py
          python3 ./tools/ThermalRecoverySelfTest.py

      - name: Run QualityGuard self test
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          mkdir -p build/qgtest

          javac \
            -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java

          java -cp build/qgtest QualityGuardSelfTest

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created"
            exit 1
          fi

          bash ./scripts/verify_apk.sh "$APK"

      - name: Prepare download file
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk"

          cd "$GITHUB_WORKSPACE/dist"

          sha256sum \
            onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk \
            > onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.sha256

          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-auto-transcriber-v3.1.11
          path: |
            dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.apk
            dist/onsamiro_auto_transcriber_v3.1.11_no_thermal_stop.sha256
          if-no-files-found: error
          retention-days: 30
