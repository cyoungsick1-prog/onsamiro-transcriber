name: Build Onsamiro v3.1.13 Realtime Detection Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'onsamiro_source_v3113_realtime_detection_fix_FINAL.zip'
      - '.github/workflows/android-build-realtime-detection-fix.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/onsamiro_source_v3113_realtime_detection_fix_FINAL.zip"
          test -f "$ZIP" || {
            echo "ERROR: source ZIP not found: $ZIP"
            exit 1
          }
          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || {
            echo "ERROR: settings.gradle not found"
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found"
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Fetch whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/*.sh || true
          bash ./scripts/fetch_whisper.sh

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash ./scripts/static_audit.sh
          python3 ./tools/NoThermalStopSelfTest.py
          python3 ./tools/ThermalRecoverySelfTest.py
          python3 ./tools/BackgroundRecoverySelfTest.py

          grep -q "applicationId 'com.onsamiro.transcriber.v3110'" app/build.gradle
          grep -q "versionName '3.1.13-realtime-detection-fix'" app/build.gradle
          grep -q 'AUTO_SAF_FALLBACK_MAX_DOCS' app/src/main/java/com/onsamiro/transcriber/DocumentScanner.java
          grep -q '녹음폴더 직접확인' app/src/main/java/com/onsamiro/transcriber/DocumentScanner.java
          grep -q 'WATCHDOG_MS = 45_000L' app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java
          grep -q 'runDirectRecovery(false)' app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java
          grep -q 'ACTIVE_WAKELOCK_MS' app/src/main/java/com/onsamiro/transcriber/TranscriptionKeepAliveService.java
          grep -q 'PROCESS_RUNNING' app/src/main/java/com/onsamiro/transcriber/WorkCoordinator.java
          grep -q 'android:name=".TranscriptionKeepAliveService"' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' app/src/main/AndroidManifest.xml
          ! grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml

          rm -rf build/qgtest
          mkdir -p build/qgtest
          javac \
            -d build/qgtest \
            app/src/main/java/com/onsamiro/transcriber/QualityGuard.java \
            tools/QualityGuardSelfTest.java
          java -cp build/qgtest QualityGuardSelfTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "ERROR: APK not created"
            exit 1
          }
          bash ./scripts/verify_apk.sh "$APK"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/온새미로_자동전사_v3.1.13_실시간감지수정.apk"
          cp "$GITHUB_WORKSPACE/onsamiro_source_v3113_realtime_detection_fix_FINAL.zip" \
             "$GITHUB_WORKSPACE/dist/onsamiro_source_v3113_realtime_detection_fix_FINAL.zip"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum \
            "온새미로_자동전사_v3.1.13_실시간감지수정.apk" \
            "onsamiro_source_v3113_realtime_detection_fix_FINAL.zip" \
            > SHA256.txt
          ls -lh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onsamiro-v3.1.13-realtime-detection-fix
          path: |
            dist/온새미로_자동전사_v3.1.13_실시간감지수정.apk
            dist/onsamiro_source_v3113_realtime_detection_fix_FINAL.zip
            dist/SHA256.txt
          if-no-files-found: warn
          retention-days: 30
